title: Advanced Scene Switcher (OBS plugin)
summary: "Automatically switch OBS Studio scenes based on various conditions"
description: |
  Advanced Scene Switcher is a plugin for OBS Studio that offers automatic
  scene switching based on various conditions including application focus,
  audio volume, time, file content, and much more.

  **Installation**

  Install the snap:

      sudo snap install advanced-scene-switcher-obs-studio

  Then connect it to the OBS Studio snap:

      sudo snap connect obs-studio:obs-plugins advanced-scene-switcher-obs-studio:obs-plugins

  Once connected, the plugin will be available in OBS Studio after restarting
  it.

website: https://github.com/WarmUpTill/SceneSwitcher
source-code: https://github.com/obs-plugins-snaps/advanced-scene-switcher-obs-studio-snap
contact: https://github.com/obs-plugins-snaps/advanced-scene-switcher-obs-studio-snap
issues: https://github.com/obs-plugins-snaps/advanced-scene-switcher-obs-studio-snap
license: GPL-2.0

grade: stable
confinement: strict

platforms:
  amd64:

slots:
  obs-plugins:
    interface: content
    source:
      read:
        - /${CRAFT_PROJECT_NAME}

parts:
  prepare-hook:
    plugin: nil
    override-build: |
      mkdir -p ${CRAFT_PART_INSTALL}/snap/hooks/
      echo -e '#!/bin/bash\nsnapctl set :obs-plugins snapname='"${CRAFT_PROJECT_NAME}" > ${CRAFT_PART_INSTALL}/snap/hooks/prepare-slot-obs-plugins

  scene-switcher:
    after:
      - prepare-hook
    source: https://github.com/WarmUpTill/SceneSwitcher.git
    source-type: git
    source-tag: '0.1.0'
    override-pull: |
      craftctl default
      craftctl set version="$(git describe --tags | sed 's/^v\([0-9]\)/\1/')"
    plugin: cmake
    build-snaps:
      - obs-studio/latest/stable
    build-packages:
      - ccache
      - nlohmann-json3-dev
      - qt6-base-dev
      - libasound2-dev
      - libcurl4-openssl-dev
      - libleptonica-dev
      - libopencv-dev
      - libpaho-mqtt-dev
      - libpaho-mqttpp-dev
      - libpipewire-0.3-dev
      - libproc2-dev
      - libsimde-dev
      - libspa-0.2-dev
      - libssl-dev
      - libtesseract-dev
      - libusb-1.0-0-dev
      - libx11-dev
      - libxkbcommon-dev
      - libxss-dev
      - libxtst-dev
    stage-packages:
      - libasound2t64
      - libb2-1
      - liblept5
      - libopencv-core406t64
      - libopencv-calib3d406t64
      - libopencv-dnn406t64
      - libopencv-features2d406t64
      - libopencv-flann406t64
      - libopencv-highgui406t64
      - libopencv-imgproc406t64
      - libopencv-ml406t64
      - libopencv-objdetect406t64
      - libopencv-video406t64
      - libopencv-videoio406t64
      - libpaho-mqttpp3-1
      - libpipewire-0.3-0t64
      - libtesseract5
      - libusb-1.0-0
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DQT_VERSION=6
    build-environment:
      - CMAKE_PREFIX_PATH: /snap/obs-studio/current/usr/
    source-submodules:
      - deps/asio
      - deps/websocketpp
      - deps/libremidi
      - deps/cpp-httplib
      - deps/jsoncons
    organize:
      usr/local/lib/obs-plugins: ${CRAFT_PROJECT_NAME}/plugins
      usr/local/share/obs/obs-plugins: ${CRAFT_PROJECT_NAME}/data
      usr/lib/x86_64-linux-gnu/libpaho-mqttpp3.so*: ${CRAFT_PROJECT_NAME}/plugins/
      usr/lib/x86_64-linux-gnu/libpaho-mqtt3as.so*: ${CRAFT_PROJECT_NAME}/plugins/
